name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например: v1.0)'
        required: true
        type: string

permissions:
  contents: write

# Opt all actions into the Node 24 runtime to avoid the 2026-06-02 forced
# migration. Affects actions/checkout, actions/setup-python and
# softprops/action-gh-release, all of which currently ship Node 20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For tag push: github.ref already points at the tag → no-op.
          # For workflow_dispatch: pin checkout to the requested tag so we
          # don't package branch HEAD under that tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build tg-mtproxy.exe
        shell: pwsh
        run: |
          # Windows port of z2k's mtproxy-client + WinDivert NAT.
          # See tools/tg-mtproxy/main.go for protocol/env-config docs.
          $ErrorActionPreference = "Stop"
          Push-Location tools\tg-mtproxy
          try {
            go build -trimpath -ldflags="-s -w" -o ..\..\tg-mtproxy.exe .
          } finally {
            Pop-Location
          }
          $size = [math]::Round((Get-Item tg-mtproxy.exe).Length / 1MB, 1)
          Write-Host "tg-mtproxy.exe — $size MB"

      - name: Install dependencies
        run: pip install pyinstaller pillow pywebview pywin32 pystray

      - name: Verify profiles.default.txt matches generator output
        shell: pwsh
        run: |
          # Regenerate from vendored z2k sources and fail if the committed
          # file drifted (e.g. hand-edit, stale vendor sync). Tools is pure
          # stdlib Python — no extra installs.
          python tools\build_profiles.py
          git diff --exit-code -- profiles.default.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::profiles.default.txt is out of sync with tools/build_profiles.py output."
            Write-Host "Re-run 'python3 tools/build_profiles.py' locally and commit the result."
            exit 1
          }

      - name: Generate icon
        shell: python
        run: |
          from PIL import Image, ImageDraw, ImageFilter

          # Palette matches in-app styles.css.
          BG_DARK  = (11, 14, 21, 255)
          BG_INNER = (19, 24, 38, 255)
          ACCENT   = (63, 185, 80, 255)
          ACCENT_F = (94, 211, 116, 255)

          def make_icon(size):
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              cx = cy = size // 2
              pad = max(1, size // 12)

              # Outer disc — near-black, rounded.
              d.ellipse([pad, pad, size-pad, size-pad], fill=BG_DARK)
              ring_w = max(1, size // 40)
              d.ellipse([pad, pad, size-pad, size-pad],
                        outline=(40, 48, 74, 200), width=ring_w)

              # Soft inner highlight (top).
              hi = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              hd = ImageDraw.Draw(hi)
              hd.ellipse([pad+ring_w, pad+ring_w,
                          size-pad-ring_w, size-pad-ring_w], fill=BG_INNER)
              img = Image.alpha_composite(img, hi)
              d = ImageDraw.Draw(img)

              # Power symbol — arc + vertical line, accent green.
              r = int(size * 0.26)
              box = [cx-r, cy-r, cx+r, cy+r]
              lw = max(2, size // 14)
              d.arc(box, start=307, end=593, fill=ACCENT, width=lw)
              d.line([cx, cy - r - lw // 2, cx, cy - r // 2],
                     fill=ACCENT_F, width=lw)

              # Subtle glow (apply for >= 48px).
              if size >= 48:
                  glow = Image.new('RGBA', (size, size), (0, 0, 0, 0))
                  gd = ImageDraw.Draw(glow)
                  gd.arc(box, start=307, end=593,
                         fill=(63, 185, 80, 80), width=lw + 2)
                  glow = glow.filter(ImageFilter.GaussianBlur(max(1, size // 28)))
                  img = Image.alpha_composite(img, glow)

              return img

          sizes = [16, 24, 32, 48, 64, 128, 256]
          imgs = [make_icon(s) for s in sizes]
          imgs[0].save('z2w.ico', format='ICO', append_images=imgs[1:])
          print('Icon created: z2w.ico')

      - name: Smoke test winws2 + generated config
        shell: pwsh
        run: |
          # Catches fork-side regressions (missing options, syntax breaks
          # in profiles, broken config_from_file()) BEFORE ship.
          # We simulate _write_winws_config(), append --dry-run inside
          # the config (since @<config_file> must be the only CLI arg),
          # invoke winws2.exe @config in an isolated dir with minimal
          # PATH so it actually exercises the production code path:
          # no Git Bash, no Cygwin, no /bin/sh on PATH. This catches
          # the wordexp-fork-fail case that broke on real user installs.
          $ErrorActionPreference = "Stop"
          $py = @'
          import re, shlex, sys
          base = []
          src = open("z2k_gui.py", encoding="utf-8").read()
          m = re.search(r"BASE_ARGS = \[([\s\S]*?)\]\n", src)
          ns = {}
          exec("BASE_ARGS = [" + m.group(1) + "]", ns)
          args = list(ns["BASE_ARGS"])
          for line in open("profiles.default.txt", encoding="utf-8"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              args.extend(line.split())
          args.append("--dry-run")
          out = "\n".join(shlex.quote(a) for a in args) + "\n"
          open("cache/winws2.smoke.conf", "w", encoding="utf-8", newline="\n").write(out)
          print(f"smoke config: {len(out)} bytes, {len(args)} tokens")
          '@
          New-Item -ItemType Directory -Force cache | Out-Null
          $py | Out-File -Encoding utf8 -NoNewline _smoke_build.py
          python _smoke_build.py

          # Stage a minimal bundle into a temp dir that mirrors the user
          # installation layout: winws2.exe + cygwin1.dll + WinDivert*
          # + lua/ + files/ + hostlists/ + windivert.filter/ + cache/conf.
          # No bash.exe, no sh.exe — same as what the user actually gets
          # from z2w.zip.
          #
          # PARENT DIR DELIBERATELY contains spaces + parentheses ("z2w (smoke)")
          # to reproduce the user-reported crash class: cygwin1.dll's path_conv
          # SIGSEGVs on paths like `C:\Program Files (x86)\z2w\` when fed
          # long-form. We then launch winws2 via GetShortPathName-style
          # invocation (same as production z2k_gui.py:start) — if a future
          # change regresses the short-path handling, this test fails before
          # the release ships.
          $stage = "$env:RUNNER_TEMP\z2w (smoke)\winws2"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item winws2.exe, cygwin1.dll, WinDivert.dll, WinDivert64.sys $stage
          Copy-Item -Recurse lua, files, hostlists, windivert.filter $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$stage\cache" | Out-Null
          Copy-Item cache\winws2.smoke.conf "$stage\cache\"

          # Strip PATH to bare-minimum Windows dirs so cygwin1.dll's
          # wordexp (if still used by upstream) can't find any external
          # /bin/sh-like helper. Reproduces production: standalone bundle
          # with nothing on PATH.
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"

          # Resolve the staging path to its 8.3 short form before passing
          # to winws2 — mirrors production behaviour (see _short_path() in
          # z2k_gui.py). If 8.3 names happen to be disabled on the runner
          # volume, GetShortPathName returns the long path verbatim and we
          # fall back to exercising the paren-bearing path directly, which
          # is also a useful signal.
          $shortStage = (New-Object -ComObject Scripting.FileSystemObject).GetFolder($stage).ShortPath
          Write-Host "Stage (long)  : $stage"
          Write-Host "Stage (short) : $shortStage"

          Write-Host "Running winws2 --dry-run via @config from minimal bundle..."
          Push-Location $shortStage
          try {
            & .\winws2.exe "@cache/winws2.smoke.conf"
            $rc = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($rc -ne 0) {
            Write-Host "::error::winws2 rejected the generated config (exit $rc)."
            Write-Host "Could be (a) a fork regression: an option in BASE_ARGS or profiles is not recognized, or (b) config_from_file() tokenizer broken for our config syntax."
            exit 1
          }
          Remove-Item -Force _smoke_build.py
          Remove-Item -Recurse -Force $stage

      - name: Build z2w.exe
        run: >
          pyinstaller
          --onefile
          --windowed
          --uac-admin
          --name z2w
          --icon z2w.ico
          --add-data "ui;ui"
          --add-data "z2w.ico;."
          --collect-data webview
          --collect-submodules webview
          --hidden-import clr_loader.types
          --hidden-import pystray._win32
          z2k_gui.py

      - name: Package release
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory "z2w-release" -Force
          $skip = @('z2k_gui.py', 'z2w.ico', 'z2w.spec', 'build', 'dist',
                    '__pycache__', '.github', '.gitignore', 'README.md',
                    'z2w-release', 'z2w.zip', 'ui')

          Get-ChildItem . |
            Where-Object { $_.Name -notin $skip } |
            ForEach-Object { Copy-Item $_.FullName $out.FullName -Recurse -Force }

          Copy-Item dist\z2w.exe "$out\z2w.exe" -Force

          Compress-Archive -Path "$out\*" -DestinationPath z2w.zip

          $mb = [math]::Round((Get-Item z2w.zip).Length / 1MB, 1)
          Write-Host "z2w.zip — $mb MB"
          Get-ChildItem $out -Recurse | Select-Object -ExpandProperty FullName

      - name: Determine tag
        id: rel
        shell: pwsh
        run: |
          $t = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          "tag=$t" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: "z2w ${{ steps.rel.outputs.tag }}"
          files: z2w.zip
          body: |
            ## Установка

            1. Скачай **`z2w.zip`** и распакуй в любую папку
            2. Запусти **`z2w.exe`** — права администратора запросятся автоматически
            3. Нажми кнопку питания для включения обхода

            > Обходит блокировки РКН, YouTube, Discord (включая голос)
