name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например: v1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For tag push: github.ref already points at the tag → no-op.
          # For workflow_dispatch: pin checkout to the requested tag so we
          # don't package branch HEAD under that tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller pillow pywebview pywin32 pystray

      - name: Verify profiles.default.txt matches generator output
        shell: pwsh
        run: |
          # Regenerate from vendored z2k sources and fail if the committed
          # file drifted (e.g. hand-edit, stale vendor sync). Tools is pure
          # stdlib Python — no extra installs.
          python tools\build_profiles.py
          git diff --exit-code -- profiles.default.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::profiles.default.txt is out of sync with tools/build_profiles.py output."
            Write-Host "Re-run 'python3 tools/build_profiles.py' locally and commit the result."
            exit 1
          }

      - name: Generate icon
        shell: python
        run: |
          from PIL import Image, ImageDraw, ImageFilter

          # Palette matches in-app styles.css.
          BG_DARK  = (11, 14, 21, 255)
          BG_INNER = (19, 24, 38, 255)
          ACCENT   = (63, 185, 80, 255)
          ACCENT_F = (94, 211, 116, 255)

          def make_icon(size):
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              cx = cy = size // 2
              pad = max(1, size // 12)

              # Outer disc — near-black, rounded.
              d.ellipse([pad, pad, size-pad, size-pad], fill=BG_DARK)
              ring_w = max(1, size // 40)
              d.ellipse([pad, pad, size-pad, size-pad],
                        outline=(40, 48, 74, 200), width=ring_w)

              # Soft inner highlight (top).
              hi = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              hd = ImageDraw.Draw(hi)
              hd.ellipse([pad+ring_w, pad+ring_w,
                          size-pad-ring_w, size-pad-ring_w], fill=BG_INNER)
              img = Image.alpha_composite(img, hi)
              d = ImageDraw.Draw(img)

              # Power symbol — arc + vertical line, accent green.
              r = int(size * 0.26)
              box = [cx-r, cy-r, cx+r, cy+r]
              lw = max(2, size // 14)
              d.arc(box, start=307, end=593, fill=ACCENT, width=lw)
              d.line([cx, cy - r - lw // 2, cx, cy - r // 2],
                     fill=ACCENT_F, width=lw)

              # Subtle glow (apply for >= 48px).
              if size >= 48:
                  glow = Image.new('RGBA', (size, size), (0, 0, 0, 0))
                  gd = ImageDraw.Draw(glow)
                  gd.arc(box, start=307, end=593,
                         fill=(63, 185, 80, 80), width=lw + 2)
                  glow = glow.filter(ImageFilter.GaussianBlur(max(1, size // 28)))
                  img = Image.alpha_composite(img, glow)

              return img

          sizes = [16, 24, 32, 48, 64, 128, 256]
          imgs = [make_icon(s) for s in sizes]
          imgs[0].save('z2w.ico', format='ICO', append_images=imgs[1:])
          print('Icon created: z2w.ico')

      - name: Smoke test winws2 + generated config
        shell: pwsh
        run: |
          # Catches fork-side regressions (missing options, syntax breaks
          # in profiles) BEFORE we ship a broken release. We simulate
          # _write_winws_config() here, append --dry-run inside the
          # config (since @<config_file> must be the only CLI arg), and
          # invoke winws2.exe @config. Exit 0 = options recognized +
          # syntax parses. Anything else fails the build.
          $ErrorActionPreference = "Stop"
          # Compose conf: BASE_ARGS lines + each non-comment profile line.
          $py = @'
          import re, shlex, sys
          base = []
          src = open("z2k_gui.py", encoding="utf-8").read()
          m = re.search(r"BASE_ARGS = \[([\s\S]*?)\]\n", src)
          ns = {}
          exec("BASE_ARGS = [" + m.group(1) + "]", ns)
          args = list(ns["BASE_ARGS"])
          for line in open("profiles.default.txt", encoding="utf-8"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              args.extend(line.split())
          # Append --dry-run so winws2 exits 0 after validating args.
          args.append("--dry-run")
          out = "\n".join(shlex.quote(a) for a in args) + "\n"
          open("cache/winws2.smoke.conf", "w", encoding="utf-8", newline="\n").write(out)
          print(f"smoke config: {len(out)} bytes, {len(args)} tokens")
          '@
          New-Item -ItemType Directory -Force cache | Out-Null
          $py | Out-File -Encoding utf8 -NoNewline _smoke_build.py
          python _smoke_build.py
          Write-Host "Running winws2 --dry-run via @config..."
          & .\winws2.exe "@cache/winws2.smoke.conf"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::winws2 rejected the generated config (exit $LASTEXITCODE)."
            Write-Host "Likely a fork regression: an option in BASE_ARGS or profiles is not recognized by winws2.exe."
            exit 1
          }
          Remove-Item -Force _smoke_build.py
          Remove-Item -Force cache/winws2.smoke.conf

      - name: Build z2w.exe
        run: >
          pyinstaller
          --onefile
          --windowed
          --uac-admin
          --name z2w
          --icon z2w.ico
          --add-data "ui;ui"
          --add-data "z2w.ico;."
          --collect-data webview
          --collect-submodules webview
          --hidden-import clr_loader.types
          --hidden-import pystray._win32
          z2k_gui.py

      - name: Package release
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory "z2w-release" -Force
          $skip = @('z2k_gui.py', 'z2w.ico', 'z2w.spec', 'build', 'dist',
                    '__pycache__', '.github', '.gitignore', 'README.md',
                    'z2w-release', 'z2w.zip', 'ui')

          Get-ChildItem . |
            Where-Object { $_.Name -notin $skip } |
            ForEach-Object { Copy-Item $_.FullName $out.FullName -Recurse -Force }

          Copy-Item dist\z2w.exe "$out\z2w.exe" -Force

          Compress-Archive -Path "$out\*" -DestinationPath z2w.zip

          $mb = [math]::Round((Get-Item z2w.zip).Length / 1MB, 1)
          Write-Host "z2w.zip — $mb MB"
          Get-ChildItem $out -Recurse | Select-Object -ExpandProperty FullName

      - name: Determine tag
        id: rel
        shell: pwsh
        run: |
          $t = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          "tag=$t" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: "z2w ${{ steps.rel.outputs.tag }}"
          files: z2w.zip
          body: |
            ## Установка

            1. Скачай **`z2w.zip`** и распакуй в любую папку
            2. Запусти **`z2w.exe`** — права администратора запросятся автоматически
            3. Нажми кнопку питания для включения обхода

            > Обходит блокировки РКН, YouTube, Discord (включая голос)
